      - 60
      - 120
      - 180
      - 300
      - 600
      - 900
      - 1800
      - 3600
      - 7200

  evaluation:
    calibration_horizons_seconds:
      - 60
      - 300
      - 900
    calibration_bins: 10

  device: auto
  seed: 42

stages:
  stage_a_binning:
    experiments:
      - id: uniform_300s_to_7200
        overrides:
          binning:
            strategy: uniform
            include_open_ended: true
            bin_width_seconds: 300
            max_time_seconds: 7200
      - id: train_quantile_18
        overrides:
          binning:
            strategy: train_quantile
            include_open_ended: true
