task_name: survival_persistence
model_name: xgboost_aft
schema_version: 1

dataset:
  path: data/processed/survival_persistence/threshold_10p0/L30/externalHoldout_test_fc_uplink_fade
  feature_set: scalar_context
  sample_weighting: uniform

model:
  objective: survival:aft
  eval_metric: aft-nloglik
  aft_loss_distribution: normal
  aft_loss_distribution_scale: 1.0
  tree_method: hist
  max_depth: 4
  learning_rate: 0.05
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  gamma: 0.0

training:
  num_boost_round: 1000
  early_stopping_rounds: 50
  eval_split: validation
  seed: 42
  nthread: -1

prediction:
  horizons_seconds:
    - 30
    - 60
    - 120
    - 180
    - 300
    - 600
    - 900
    - 1800
    - 3600
    - 7200

evaluation:
  calibration_horizons_seconds:
    - 60
    - 300
    - 900
  calibration_bins: 10
  bootstrap_replicates: 200

output:
  overwrite: false

seed: 42
