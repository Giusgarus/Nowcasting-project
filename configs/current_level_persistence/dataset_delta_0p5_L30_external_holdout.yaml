task_name: current_level_persistence
context_length: 30
delta: 0.5
sampling_time_seconds: 30
external_test_dataset: fc-uplink-fade.csv

source:
  event_windows_path: data/interim/event_windows/threshold_10p0/all_event_windows.parquet
  event_quality_path: data/interim/event_windows/threshold_10p0/event_window_quality.parquet
  full_signal_path: data/interim/clean_signal/all_signal_clean.parquet
  signal_column: Signal_prepared
  full_signal_column: Signal

small_gap_imputation:
  enabled: true
  expected_seconds: 30
  max_gap_seconds: 90
  max_missing_run: 2
  method: linear_time

event_window_quality:
  allow_warning_events_for_window_index: true

input_columns:
  time: Time
  signal: Signal_prepared

input_representation:
  raw: true
  relative_to_current: true
  scalar_context: true

target:
  samples: true
  seconds: true
  log1p_seconds: true

split:
  mode: external_holdout_by_dataset
  external_test_dataset: fc-uplink-fade.csv
  development_event_split:
    train_fraction: 0.85
    validation_fraction: 0.15
    small_dataset_policy: all_train_if_less_than_3_events
    min_events_for_validation_split: 3

output_dir: data/processed/current_level_persistence/delta_0p5/L30/externalHoldout_test_fc_uplink_fade/
output:
  overwrite: false

seed: 42
