data:
  selection_id: externalHoldout_test_fc_uplink_fade_L30_h10_thr10

methods:
  - name: GRU S2V Raw
    model_family: gru
    architecture: gru_s2v
    variant: raw
  - name: GRU S2V Context Standard
    model_family: gru
    architecture: gru_s2v
    variant: context_standard
  - name: GRU Seq2Seq Raw
    model_family: gru
    architecture: gru_seq2seq
    variant: raw
  - name: GRU Seq2Seq Context Standard
    model_family: gru
    architecture: gru_seq2seq
    variant: context_standard
  - name: PatchTST Raw
    model_family: patchtst
    architecture: patchtst
    variant: raw
  - name: PatchTST Context Standard
    model_family: patchtst
    architecture: patchtst
    variant: context_standard
  - name: XGBoost Raw
    model_family: xgboost
    architecture: xgboost
    variant: raw
  - name: XGBoost Context Standard
    model_family: xgboost
    architecture: xgboost
    variant: context_standard
  - name: Chronos Zero-Shot Raw
    model_family: chronos
    architecture: chronos_zero_shot
    variant: raw

conversion:
  prediction_aggregation: horizon_threshold_count
  threshold: 10.0
  condition: greater_than
  required_points_above_threshold: 10
  switch_time: 10
  apply_min_island_length: true

plots:
  max_events: 20

output:
  overwrite: true
