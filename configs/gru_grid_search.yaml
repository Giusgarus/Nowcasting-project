schema_version: 1

search:
  model_family: gru
  architectures:
    - gru_s2v
    - gru_seq2seq
  variants:
    - raw
    - context_standard
  selection_metric: validation_rmse_raw
  selection_mode: min

parallel:
  enabled: true
  max_workers: 3
  cuda_device_ids: auto

data:
  dataset_root: data/processed/autoregressive/threshold_10p0/datasets_L30_h10
  selection_folder: externalHoldout_test_fc_uplink_fade
  prediction_length: 10

fixed_model:
  input_size: 1
  dropout: 0.1
  bidirectional: false

parameter_grid:
  hidden_size:
    - 16
    - 32
    - 64
    - 128
  num_layers:
    - 1
    - 2
    - 3
  learning_rate:
    - 0.0001
    - 0.0003
    - 0.001
  weight_decay:
    - 0.0
    - 0.0001

final_training:
  retrain_on_full_development: true
  use_best_epoch_from_grid: true
  early_stopping: false

training:
  batch_size: 64
  max_epochs: 120
  early_stopping_patience: 15
  gradient_clip_norm: 1.0
  seed: 42

seq2seq:
  teacher_forcing_ratio:
    - 0.0
    - 0.25
    - 0.5

output:
  overwrite: true
  update_canonical_runs: true
  save_trial_histories: true
  save_best_predictions: true
  save_best_plots: true
