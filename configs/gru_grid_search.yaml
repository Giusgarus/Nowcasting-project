schema_version: 1

search:
  model_family: gru
  architectures:
    - gru_s2v
    - gru_seq2seq
  variants:
    - raw
    - context_standard
  selection_metric: validation_rmse_raw
  selection_mode: min

data:
  dataset_root: data/processed/autoregressive/threshold_10p0/datasets_L30_h10
  selection_folder: auto
  prediction_length: 10

fixed_model:
  input_size: 1
  dropout: 0.0
  bidirectional: false

parameter_grid:
  hidden_size:
    - 8
    - 16
    - 32
    - 64
    - 128
  num_layers:
    - 1
    - 2
    - 3
  learning_rate:
    - 0.0001
    - 0.0003
    - 0.0005
    - 0.001
    - 0.003
  weight_decay:
    - 0.0
    - 0.00001
    - 0.0001

training:
  batch_size: 64
  max_epochs: 120
  early_stopping_patience: 15
  gradient_clip_norm: 1.0
  seed: 42

seq2seq:
  teacher_forcing_ratio:
    - 0.0
    - 0.5

output:
  overwrite: true
  update_canonical_runs: true
  save_trial_histories: true
  save_best_predictions: true
  save_best_plots: true