data:
  threshold_folder: threshold_10p0
  event_windows_path: data/interim/event_windows/threshold_10p0/all_event_windows.parquet
  window_index_path: data/processed/autoregressive/threshold_10p0/window_index_L30_h10.parquet
  output_root: data/processed/autoregressive/threshold_10p0/datasets_L30_h10
  results_root: results/data_preparation

forecasting:
  context_length: 30
  prediction_length: 10
  signal_column: Signal_prepared

dataset_selection:
  mode: auto_largest
  selected_datasets: []
  ranking_metric: num_valid_autoregressive_windows
  allow_warning_events: true

normalization:
  versions:
    - raw
    - context_standard
  context_standard:
    center: mean
    scale: std
    epsilon: 1.0e-6
    fit_on: input_context_only

output:
  save_npz: true
  save_metadata_parquet: true
  save_summary_csv: true
  overwrite: false

seed: 42
