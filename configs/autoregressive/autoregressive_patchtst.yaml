schema_version: 1

experiment:
  model_name: patchtst
  run_name: patchtst_baselines
  variants:
    - raw
    - context_standard

data:
  dataset_root: data/processed/autoregressive/threshold_10p0/datasets_L30_h10
  selection_folder: externalHoldout_test_fc_uplink_fade
  context_length: 30
  prediction_length: 10

model:
  input_channels: 1
  patch_len: 5
  stride: 5
  d_model: 64
  n_heads: 4
  num_layers: 2
  dropout: 0.1

training:
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.00001
  max_epochs: 120
  early_stopping_patience: 15
  gradient_clip_norm: 1.0
  seed: 42
  loss: mse

evaluation:
  evaluate_in_raw_scale: true

output:
  save_predictions: true
  save_plots: true
  overwrite: false
