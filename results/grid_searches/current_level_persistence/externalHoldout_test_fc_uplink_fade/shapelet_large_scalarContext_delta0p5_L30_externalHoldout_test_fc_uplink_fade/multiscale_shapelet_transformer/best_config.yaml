task_name: current_level_persistence
model_family: learnable_shapelets
model_id: multiscale_shapelet_transformer
selection_id: externalHoldout_test_fc_uplink_fade
dataset:
  path: data/processed/current_level_persistence/delta_0p5/L30/externalHoldout_test_fc_uplink_fade/
  input_key: X_relative_to_current
  raw_input_key: X_raw
  scalar_context_key: scalar_context_features
  target_key: y_log1p_remaining_persistence_seconds
features:
  use_scalar_context: true
  scalar_context_key: scalar_context_features
  scalar_context_standardize: true
scalar_encoder:
  hidden_dim: 32
  dropout: 0.1
target:
  train_space: log1p_seconds
  eval_space: seconds
training:
  loss: huber
  batch_size: 256
  max_epochs: 80
  early_stopping_patience: 12
  learning_rate: 0.001
  weight_decay: 0.0001
  device: auto
  mixed_precision: false
  gradient_clip_norm: 1.0
  num_workers: 0
  seed: 42
shapelets:
  shapelet_lengths:
  - 5
  - 10
  - 15
  n_shapelets_per_length: 16
model:
  n_heads: 4
  pooling: mean
  d_model: 32
  num_layers: 1
  dropout: 0.0
evaluation:
  primary_selection_metric: val_mae_seconds
context_length: 30
